name: Reproduce

# Rebuilds everything from the pinned sources and fails if the result differs from what is
# committed: every number on the site must come out of ./build unchanged. Also checks that
# every feature and profile citation still resolves at its pinned revision.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: auto  # LND's go.mod names the Go version it resolves with
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned tools
        run: |
          python3 -m pip install --user -r requirements.txt
          npm ci --no-audit --no-fund
          go version
          cargo --version

      - name: Build from the pinned sources
        run: ./build

      - name: The committed data and site are exactly what the build produced
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"
